spring:
  application:
    name: survey-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/sbsurvey
    username: survey
    password: survey
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: 8080

logging:
  level:
    org.springframework: INFO
    com.sbsurvey: DEBUG

security:
  jwt:
    secret: change-me-super-secret-key
    expiration-minutes: 120
