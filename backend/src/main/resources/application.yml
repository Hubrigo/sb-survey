spring:
  application:
    name: survey-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sbsurvey}
    username: ${SPRING_DATASOURCE_USERNAME:survey}
    password: ${SPRING_DATASOURCE_PASSWORD:survey}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: 8080

logging:
  level:
    org.springframework: INFO
    com.sbsurvey: DEBUG

security:
  jwt:
    private-key: ${SECURITY_JWT_PRIVATE_KEY:}
    public-key: ${SECURITY_JWT_PUBLIC_KEY:}
    expiration-minutes: 120
